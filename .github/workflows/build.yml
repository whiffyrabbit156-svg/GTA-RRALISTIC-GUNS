name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cabeceras de AML
        run: git clone --depth 1 https://github.com/RusJJ/AndroidModLoader.git aml
      - name: Compilar (arm64)
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          CXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"
          "$CXX" -shared -fPIC -std=c++17 -O2 -I aml -o libRealWeapons.so /main.cpp -llog -ldl
          ls -l libRealWeapons.so
      - uses: actions/upload-artifact@v4
        with:
          name: libRealWeapons
          path: libRealWeapons.so
