name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cabeceras de AML
        run: git clone --depth 1 https://github.com/RusJJ/AndroidModLoader.git aml
      - name: Compilar RealWeapons2 ARM64 y ARM32
        shell: bash
        run: |
          set -euo pipefail
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:?ANDROID_NDK_HOME no está definido}}"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p dist/arm64-v8a dist/armeabi-v7a

          "$TOOLCHAIN/aarch64-linux-android24-clang++" \
            -shared -fPIC -std=c++17 -O2 -static-libstdc++ \
            -I aml -Wl,-soname,libRealWeapons2.so \
            -o dist/arm64-v8a/libRealWeapons2.so main_v2.cpp -llog -ldl

          "$TOOLCHAIN/armv7a-linux-androideabi24-clang++" \
            -shared -fPIC -std=c++17 -O2 -static-libstdc++ \
            -I aml -Wl,-soname,libRealWeapons2.so \
            -o dist/armeabi-v7a/libRealWeapons2.so main_v2.cpp -llog -ldl

          readelf -hW dist/arm64-v8a/libRealWeapons2.so | grep -q 'Class:.*ELF64'
          readelf -hW dist/arm64-v8a/libRealWeapons2.so | grep -q 'Machine:.*AArch64'
          readelf -hW dist/armeabi-v7a/libRealWeapons2.so | grep -q 'Class:.*ELF32'
          readelf -hW dist/armeabi-v7a/libRealWeapons2.so | grep -q 'Machine:.*ARM'
          for so in dist/arm64-v8a/libRealWeapons2.so dist/armeabi-v7a/libRealWeapons2.so; do
            if readelf -dW "$so" | grep -Fq 'libc++_shared.so'; then
              echo "::error::$so depende de libc++_shared.so"
              exit 1
            fi
            ls -l "$so"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: RealWeapons2-arm64
          path: dist/arm64-v8a/libRealWeapons2.so
      - uses: actions/upload-artifact@v4
        with:
          name: RealWeapons2-arm32
          path: dist/armeabi-v7a/libRealWeapons2.so
