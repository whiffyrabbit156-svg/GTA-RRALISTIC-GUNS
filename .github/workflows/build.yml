name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cabeceras de AML
        run: git clone --depth 1 https://github.com/RusJJ/AndroidModLoader.git aml
      - name: Compilar (arm64, libc++ estatica)
        shell: bash
        run: |
          set -euo pipefail
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:?ANDROID_NDK_HOME no está definido}}"
          CXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"
          "$CXX" \
            -shared -fPIC -std=c++17 -O2 \
            -static-libstdc++ \
            -I aml \
            -Wl,-soname,libRealWeapons.so \
            -o libRealWeapons.so main.cpp \
            -llog -ldl
          readelf -hW libRealWeapons.so | grep -q 'AArch64'
          if readelf -dW libRealWeapons.so | grep -Fq 'libc++_shared.so'; then
            echo "::error::libRealWeapons.so depende de libc++_shared.so"
            exit 1
          fi
          mkdir -p dist
          cp libRealWeapons.so dist/
          ls -l dist/libRealWeapons.so
      - uses: actions/upload-artifact@v4
        with:
          name: libRealWeapons
          path: dist/libRealWeapons.so

